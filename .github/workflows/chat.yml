name: Character Bot

on:
  schedule:
    # Запуск каждые 2 часа (в 00 минут каждого чётного часа)
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          DEEPSEEK_API_KEY: \${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_TOKEN: \${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: \${{ secrets.CHAT_ID }}
          USER_TIMEZONE: \${{ secrets.USER_TIMEZONE }}
        run: python bot.py

      - name: Save dialogue history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем правильный файл истории
          git add dialogue_history.json
          
          # Проверяем, есть ли изменения. Если есть — делаем коммит и пуш
          if ! git diff --cached --quiet; then
            git commit -m "Update dialogue history"
            git push
          else
            echo "No changes to commit"
          fi
