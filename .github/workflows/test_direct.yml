name: Test DeepSeek Direct
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check key presence
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "❌ DEEPSEEK_API_KEY is empty!"
            exit 1
          else
            echo "✅ Key starts with: ${DEEPSEEK_API_KEY:0:10}"
          fi
      - name: Call DeepSeek API directly
        run: |
          curl -s -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
               https://api.deepseek.com/v1/models | head -n 5
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
