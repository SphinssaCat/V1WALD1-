name: Ви — Бот-собеседник

on:
  schedule:
    - cron: '*/15 * * * *'    # каждые 15 минут
  workflow_dispatch:           # + ручной запуск

jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Запуск бота
        run: python bot.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          USER_TIMEZONE: ${{ secrets.USER_TIMEZONE }}

      - name: Сохранение истории диалога
        run: |
          git config --local user.email "vi-bot@arcadia.ai"
          git config --local user.name "Вивальди"
          git add dialogue_history.json last_proactive.json tg_offset.json 2>/dev/null || true
          git commit -m "Обновление истории диалога" || echo "Нет изменений"
          git push || echo "Push не требуется"
